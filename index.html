<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nebula Messenger 0.9</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#080b14;
    color:#fff;
}
button,input{
    font-family:inherit;
}
button{
    border:0;
    cursor:pointer;
}
.app{
    max-width:1100px;
    height:100vh;
    margin:auto;
    display:flex;
    background:#0d111d;
    overflow:hidden;
}

/* SIDEBAR */
.sidebar{
    width:330px;
    border-left:1px solid #202638;
    display:flex;
    flex-direction:column;
}
.header{
    padding:18px;
    border-bottom:1px solid #202638;
}
.brand{
    font-size:24px;
    font-weight:bold;
}
.brand span{
    color:#7c5cff;
}
.me{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#151a29;
    padding:12px;
    border-radius:15px;
}
.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#20283d;
    font-size:25px;
}
.me-info{
    flex:1;
}
.me-name{
    font-weight:bold;
}
.status{
    font-size:12px;
    color:#7dffad;
    margin-top:4px;
}
.search{
    margin-top:14px;
}
.search input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #293149;
    background:#0b0f19;
    color:white;
    outline:none;
}
.tabs{
    display:flex;
    padding:10px;
    gap:8px;
}
.tab{
    flex:1;
    padding:10px;
    border-radius:10px;
    background:#151a29;
    color:#aaa;
}
.tab.active{
    background:#6f52e8;
    color:white;
}
.list{
    flex:1;
    overflow:auto;
    padding:8px;
}
.chat-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:13px;
    margin-bottom:5px;
    cursor:pointer;
}
.chat-item:hover{
    background:#171d2d;
}
.chat-item.active{
    background:#1b2235;
}
.chat-info{
    flex:1;
    min-width:0;
}
.chat-top{
    display:flex;
    justify-content:space-between;
}
.chat-name{
    font-weight:bold;
}
.time{
    font-size:10px;
    color:#777;
}
.preview{
    color:#888;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:4px;
}
.badge{
    background:#7658ff;
    color:#fff;
    min-width:20px;
    height:20px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}
.empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
}
.chat-header{
    padding:13px 18px;
    border-bottom:1px solid #202638;
    display:flex;
    align-items:center;
    gap:12px;
}
.chat-title{
    flex:1;
}
.chat-title strong{
    display:block;
}
.chat-status{
    font-size:11px;
    color:#777;
    margin-top:4px;
}
.header-btn{
    background:#171d2d;
    color:white;
    width:38px;
    height:38px;
    border-radius:11px;
}
.messages{
    flex:1;
    overflow:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
}
.msg{
    max-width:75%;
    padding:9px 12px;
    border-radius:15px;
    position:relative;
    line-height:1.7;
    word-break:break-word;
}
.msg.mine{
    align-self:flex-start;
    background:#6f52e8;
    border-bottom-left-radius:4px;
}
.msg.theirs{
    align-self:flex-end;
    background:#192033;
    border-bottom-right-radius:4px;
}
.msg-time{
    font-size:9px;
    opacity:.6;
    margin-right:6px;
}
.msg-actions{
    display:none;
    position:absolute;
    top:-35px;
    right:0;
    background:#101522;
    border:1px solid #293149;
    border-radius:10px;
    padding:4px;
    z-index:5;
}
.msg:hover .msg-actions{
    display:flex;
    gap:3px;
}
.msg-actions button{
    background:#20283a;
    color:white;
    padding:5px 7px;
    border-radius:7px;
}
.reaction{
    position:absolute;
    bottom:-12px;
    left:8px;
    background:#111827;
    border-radius:10px;
    padding:1px 6px;
    font-size:12px;
}
.audio{
    width:230px;
}
.composer{
    padding:12px;
    border-top:1px solid #202638;
    display:flex;
    gap:8px;
}
.composer input{
    flex:1;
    background:#151a29;
    border:1px solid #293149;
    color:white;
    border-radius:13px;
    padding:12px;
    outline:none;
}
.send,.record{
    width:45px;
    border-radius:13px;
    color:white;
}
.send{
    background:#6f52e8;
}
.record{
    background:#252d40;
}
.record.recording{
    background:#d64d67;
}
.editing{
    background:#211c38;
    padding:7px 14px;
    font-size:12px;
    display:none;
}
.editing.show{
    display:block;
}

/* PAGES */
.page{
    flex:1;
    overflow:auto;
    padding:25px;
}
.card{
    background:#151a29;
    border:1px solid #242c40;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}
.card h2{
    margin-top:0;
}
.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #252c3d;
}
.row:last-child{
    border-bottom:0;
}
.primary{
    background:#6f52e8;
    color:white;
    padding:10px 16px;
    border-radius:11px;
}
.danger{
    background:#c9475d;
    color:white;
    padding:10px 16px;
    border-radius:11px;
}
.secondary{
    background:#252d40;
    color:white;
    padding:10px 16px;
    border-radius:11px;
}
.profile-big{
    display:flex;
    align-items:center;
    gap:15px;
}
.profile-big .avatar{
    width:75px;
    height:75px;
    font-size:38px;
}
.profile-input{
    width:100%;
    padding:12px;
    margin-top:7px;
    background:#0c111d;
    color:white;
    border:1px solid #293149;
    border-radius:10px;
    outline:none;
}
.emoji-list{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
}
.emoji-list button{
    background:#20283a;
    font-size:22px;
    padding:7px 10px;
    border-radius:10px;
}
.contact{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    background:#151a29;
    margin-bottom:8px;
    border-radius:13px;
}
.contact .contact-info{
    flex:1;
}
.plus{
    background:#6f52e8;
    color:white;
    width:42px;
    height:42px;
    border-radius:12px;
    font-size:22px;
}
@media(max-width:700px){
    .sidebar{width:100%}
    .main{display:none}
    .sidebar.chat-open{display:none}
    .main.mobile-show{display:flex}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="header">
        <div class="brand">🌌 Nebula <span>Messenger</span></div>

        <div class="me" onclick="showPage('profile')">
            <div class="avatar" id="myAvatar">🌌</div>
            <div class="me-info">
                <div class="me-name" id="myName">کاربر</div>
                <div class="status">● آنلاین</div>
            </div>
            <button class="plus" onclick="event.stopPropagation();showPage('contacts')">+</button>
        </div>

        <div class="search">
            <input id="search" placeholder="🔎 جستجو..." oninput="renderCurrentList()">
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabChats" onclick="setTab('chats')">💬 چت‌ها</button>
        <button class="tab" id="tabContacts" onclick="setTab('contacts')">👥 مخاطبین</button>
    </div>

    <div class="list" id="list"></div>

    <div style="padding:10px;border-top:1px solid #202638">
        <button class="secondary" style="width:100%" onclick="showPage('settings')">⚙️ تنظیمات</button>
    </div>
</aside>

<main class="main" id="main">

    <div class="empty" id="empty">
        <div>
            <div style="font-size:60px">🌌</div>
            <h2>Nebula Messenger</h2>
            <p>یک چت را انتخاب کنید یا از + برای شروع استفاده کنید.</p>
        </div>
    </div>

    <section id="chat" style="display:none;flex:1;flex-direction:column">

        <div class="chat-header">
            <div class="avatar" id="chatAvatar">🌌</div>

            <div class="chat-title">
                <strong id="chatName">کاربر</strong>
                <div class="chat-status" id="chatStatus">● آفلاین</div>
            </div>

            <button class="header-btn" onclick="pinCurrentChat()">📌</button>
            <button class="header-btn" onclick="deleteCurrentChat()">🗑️</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="editing" id="editingBar">
            ✏️ در حال ویرایش پیام
            <button onclick="cancelEdit()" style="float:left;background:none;color:#fff">✕</button>
        </div>

        <div class="composer">
            <button class="record" id="recordBtn" onclick="toggleRecording()">🎙️</button>
            <input id="messageInput" placeholder="پیامتان را بنویسید..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="send" onclick="sendMessage()">➤</button>
        </div>

    </section>

    <section class="page" id="profilePage" style="display:none">
        <div class="card">
            <h2>👤 پروفایل من</h2>

            <div class="profile-big">
                <div class="avatar" id="profileAvatar">🌌</div>
                <div>
                    <h3 id="profileName">کاربر</h3>
                    <span style="color:#7dffad">● آنلاین</span>
                </div>
            </div>

            <br>

            <label>نام کاربری</label>
            <input class="profile-input" id="usernameInput">

            <br><br>

            <label>وضعیت</label>
            <input class="profile-input" id="statusInput">

            <br><br>

            <label>آواتار</label>
            <div class="emoji-list">
                <button onclick="selectAvatar('🌌')">🌌</button>
                <button onclick="selectAvatar('😎')">😎</button>
                <button onclick="selectAvatar('🚀')">🚀</button>
                <button onclick="selectAvatar('👾')">👾</button>
                <button onclick="selectAvatar('🤖')">🤖</button>
                <button onclick="selectAvatar('🔥')">🔥</button>
                <button onclick="selectAvatar('⭐')">⭐</button>
                <button onclick="selectAvatar('🎮')">🎮</button>
            </div>

            <br>
            <button class="primary" onclick="saveProfile()">💾 ذخیره تغییرات</button>
        </div>
    </section>

    <section class="page" id="contactsPage" style="display:none">
        <div class="card">
            <h2>👥 مخاطبین</h2>
            <div id="contacts"></div>
        </div>
    </section>

    <section class="page" id="settingsPage" style="display:none">
        <div class="card">
            <h2>⚙️ تنظیمات</h2>

            <div class="row">
                <span>🌌 نسخه</span>
                <strong>0.9</strong>
            </div>

            <div class="row">
                <span>💾 حالت ذخیره‌سازی</span>
                <strong>Local</strong>
            </div>

            <div class="row">
                <span>🔔 اعلان‌ها</span>
                <strong>فعال</strong>
            </div>

            <div class="row">
                <span>🗑️ پاک کردن همه اطلاعات</span>
                <button class="danger" onclick="resetApp()">پاک کردن</button>
            </div>
        </div>
    </section>

</main>
</div>

<script>
/* =========================
   DATABASE
========================= */

const USERS_KEY = "nebulaUsers";
const CURRENT_KEY = "nebulaCurrentUser";

let users = JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
let currentUser = localStorage.getItem(CURRENT_KEY);
let currentChat = null;
let currentTab = "chats";
let editMessageId = null;
let selectedAvatar = "🌌";
let recorder = null;
let audioChunks = [];
let recording = false;

function saveUsers(){
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

function getMe(){
    return users.find(u=>u.name===currentUser);
}

function chatKey(a,b){
    return "nebula_chat_" + [a,b].sort().join("__");
}

function readKey(a,b){
    return "nebula_read_" + [a,b].sort().join("__");
}

function getChat(a,b){
    return JSON.parse(localStorage.getItem(chatKey(a,b)) || "[]");
}

function saveChat(a,b,messages){
    localStorage.setItem(chatKey(a,b),JSON.stringify(messages));
}

function timeText(ts){
    return new Date(ts).toLocaleTimeString("fa-IR",{
        hour:"2-digit",
        minute:"2-digit"
    });
}

/* =========================
   INITIAL DATA
========================= */

if(!users.length){
    users=[
        {
            name:"Nebula Bot",
            avatar:"🤖",
            passwordHash:"",
            online:false,
            status:"ربات رسمی Nebula 🌌",
            createdAt:Date.now()
        },
        {
            name:"Test User",
            avatar:"👾",
            passwordHash:"",
            online:false,
            status:"در Nebula هستم!",
            createdAt:Date.now()
        }
    ];
    saveUsers();
}

if(!currentUser){
    const newName="Amir";
    users.push({
        name:newName,
        avatar:"🌌",
        passwordHash:"",
        online:true,
        status:"سلام! من در Nebula هستم 🌌",
        createdAt:Date.now()
    });
    currentUser=newName;
    localStorage.setItem(CURRENT_KEY,currentUser);
    saveUsers();
}

const me=getMe();
if(me){
    me.online=true;
    saveUsers();
}

/* =========================
   UI
========================= */

function updateMeUI(){
    const me=getMe();
    if(!me)return;

    document.getElementById("myName").textContent=me.name;
    document.getElementById("myAvatar").textContent=me.avatar;
    document.getElementById("profileAvatar").textContent=me.avatar;
    document.getElementById("profileName").textContent=me.name;
}

function setTab(tab){
    currentTab=tab;

    document.getElementById("tabChats").classList.toggle("active",tab==="chats");
    document.getElementById("tabContacts").classList.toggle("active",tab==="contacts");

    renderCurrentList();
}

function renderCurrentList(){
    if(currentTab==="chats"){
        renderChats();
    }else{
        renderContacts();
    }
}

function renderChats(){
    const box=document.getElementById("list");
    const query=document.getElementById("search").value.toLowerCase();

    let people=users.filter(u=>u.name!==currentUser);

    let data=people.map(user=>{
        const messages=getChat(currentUser,user.name);
        const last=messages[messages.length-1];

        const read=Number(localStorage.getItem(readKey(currentUser,user.name))||0);

        const unread=messages.filter(m=>
            m.sender!==currentUser && m.time>read
        ).length;

        return {user,last,unread};
    });

    data.sort((a,b)=>{
        const ap=a.user.pinned?1:0;
        const bp=b.user.pinned?1:0;

        if(ap!==bp)return bp-ap;

        return (b.last?.time||0)-(a.last?.time||0);
    });

    data=data.filter(x=>
        x.user.name.toLowerCase().includes(query)
    );

    box.innerHTML="";

    if(!data.length){
        box.innerHTML='<div style="padding:20px;text-align:center;color:#777">چتی پیدا نشد.</div>';
        return;
    }

    data.forEach(({user,last,unread})=>{
        const el=document.createElement("div");
        el.className="chat-item "+(currentChat===user.name?"active":"");

        el.onclick=()=>openChat(user.name);

        el.oncontextmenu=e=>{
            e.preventDefault();
            user.pinned=!user.pinned;
            saveUsers();
            renderChats();
        };

        el.innerHTML=`
            <div class="avatar">${user.avatar}</div>
            <div class="chat-info">
                <div class="chat-top">
                    <span class="chat-name">
                        ${user.pinned?"📌 ":""}${escapeHTML(user.name)}
                    </span>
                    <span class="time">${last?timeText(last.time):""}</span>
                </div>
                <div class="preview">
                    ${last?previewMessage(last):user.status||"شروع گفتگو"}
                </div>
            </div>
            ${unread?`<div class="badge">${unread}</div>`:""}
        `;

        box.appendChild(el);
    });
}

function renderContacts(){
    const box=document.getElementById("list");
    const query=document.getElementById("search").value.toLowerCase();

    box.innerHTML="";

    users
    .filter(u=>u.name!==currentUser)
    .filter(u=>u.name.toLowerCase().includes(query))
    .forEach(user=>{
        const el=document.createElement("div");
        el.className="chat-item";

        el.onclick=()=>openChat(user.name);

        el.innerHTML=`
            <div class="avatar">${user.avatar}</div>
            <div class="chat-info">
                <div class="chat-name">${escapeHTML(user.name)}</div>
                <div class="preview">${escapeHTML(user.status||"بدون وضعیت")}</div>
            </div>
            <span style="font-size:10px;color:${user.online?"#70e09c":"#777"}">
                ${user.online?"● آنلاین":"○ آفلاین"}
            </span>
        `;

        box.appendChild(el);
    });
}

function previewMessage(m){
    if(m.type==="audio")return "🎙️ پیام صوتی";
    if(m.deleted)return "پیام حذف شد";
    return escapeHTML(m.text||"");
}

/* =========================
   CHAT
========================= */

function openChat(name){
    currentChat=name;

    document.getElementById("empty").style.display="none";
    document.getElementById("chat").style.display="flex";

    document.getElementById("profilePage").style.display="none";
    document.getElementById("contactsPage").style.display="none";
    document.getElementById("settingsPage").style.display="none";

    const user=users.find(u=>u.name===name);
    if(!user)return;

    document.getElementById("chatAvatar").textContent=user.avatar;
    document.getElementById("chatName").textContent=user.name;
    document.getElementById("chatStatus").textContent=
        user.online?"● آنلاین":"○ "+(user.status||"آفلاین");

    localStorage.setItem(
        readKey(currentUser,name),
        Date.now()
    );

    renderMessages();
    renderChats();
}

function renderMessages(){
    const box=document.getElementById("messages");
    box.innerHTML="";

    if(!currentChat)return;

    const messages=getChat(currentUser,currentChat);

    messages.forEach(m=>{
        const el=document.createElement("div");

        el.className="msg "+(m.sender===currentUser?"mine":"theirs");

        let content="";

        if(m.deleted){
            content=`<i style="opacity:.6">این پیام حذف شده است</i>`;
        }
        else if(m.type==="audio"){
            content=`
                <audio class="audio" controls src="${m.audio}"></audio>
            `;
        }
        else{
            content=escapeHTML(m.text||"");
        }

        el.innerHTML=`
            ${content}

            <span class="msg-time">${timeText(m.time)}</span>

            ${
                m.sender===currentUser && !m.deleted
                ?
                `<div class="msg-actions">
                    <button onclick="editMessage('${m.id}')">✏️</button>
                    <button onclick="deleteMessage('${m.id}')">🗑️</button>
                    <button onclick="reactMessage('${m.id}','❤️')">❤️</button>
                    <button onclick="reactMessage('${m.id}','😂')">😂</button>
                </div>`
                :
                `<div class="msg-actions">
                    <button onclick="reactMessage('${m.id}','❤️')">❤️</button>
                    <button onclick="reactMessage('${m.id}','😂')">😂</button>
                    <button onclick="reactMessage('${m.id}','👍')">👍</button>
                </div>`
            }

            ${m.reaction?`<span class="reaction">${m.reaction}</span>`:""}
        `;

        box.appendChild(el);
    });

    box.scrollTop=box.scrollHeight;
}

function sendMessage(){
    const input=document.getElementById("messageInput");
    const text=input.value.trim();

    if(!text || !currentChat)return;

    const messages=getChat(currentUser,currentChat);

    if(editMessageId){
        const msg=messages.find(m=>m.id===editMessageId);

        if(msg){
            msg.text=text;
            msg.edited=true;
        }

        saveChat(currentUser,currentChat,messages);

        editMessageId=null;
        document.getElementById("editingBar").classList.remove("show");
        input.value="";

        renderMessages();
        renderChats();
        return;
    }

    messages.push({
        id:crypto.randomUUID(),
        sender:currentUser,
        text:text,
        type:"text",
        time:Date.now(),
        reaction:null
    });

    saveChat(currentUser,currentChat,messages);

    input.value="";
    renderMessages();
    renderChats();
}

/* =========================
   MESSAGE ACTIONS
========================= */

function editMessage(id){
    const messages=getChat(currentUser,currentChat);
    const msg=messages.find(m=>m.id===id);

    if(!msg || msg.sender!==currentUser || msg.type==="audio")return;

    editMessageId=id;

    document.getElementById("messageInput").value=msg.text;
    document.getElementById("messageInput").focus();

    document.getElementById("editingBar").classList.add("show");
}

function cancelEdit(){
    editMessageId=null;
    document.getElementById("messageInput").value="";
    document.getElementById("editingBar").classList.remove("show");
}

function deleteMessage(id){
    const messages=getChat(currentUser,currentChat);
    const msg=messages.find(m=>m.id===id);

    if(!msg || msg.sender!==currentUser)return;

    msg.deleted=true;
    msg.text="";
    msg.audio=null;

    saveChat(currentUser,currentChat,messages);
    renderMessages();
    renderChats();
}

function reactMessage(id,emoji){
    const messages=getChat(currentUser,currentChat);
    const msg=messages.find(m=>m.id===id);

    if(!msg)return;

    msg.reaction=msg.reaction===emoji?null:emoji;

    saveChat(currentUser,currentChat,messages);
    renderMessages();
}

function pinCurrentChat(){
    if(!currentChat)return;

    const user=users.find(u=>u.name===currentChat);
    if(!user)return;

    user.pinned=!user.pinned;
    saveUsers();
    renderChats();
}

function deleteCurrentChat(){
    if(!currentChat)return;

    if(confirm("آیا این گفتگو حذف شود؟")){
        localStorage.removeItem(chatKey(currentUser,currentChat));
        localStorage.removeItem(readKey(currentUser,currentChat));

        currentChat=null;

        document.getElementById("chat").style.display="none";
        document.getElementById("empty").style.display="flex";

        renderChats();
    }
}

/* =========================
   VOICE MESSAGE
========================= */

async function toggleRecording(){

    if(recording){
        recorder.stop();
        recording=false;

        document.getElementById("recordBtn").classList.remove("recording");
        document.getElementById("recordBtn").textContent="🎙️";

        return;
    }

    if(!currentChat){
        alert("اول یک چت را انتخاب کنید.");
        return;
    }

    try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});

        audioChunks=[];

        recorder=new MediaRecorder(stream);

        recorder.ondataavailable=e=>{
            if(e.data.size>0)audioChunks.push(e.data);
        };

        recorder.onstop=()=>{
            const blob=new Blob(audioChunks,{type:"audio/webm"});
            const reader=new FileReader();

            reader.onloadend=()=>{
                const messages=getChat(currentUser,currentChat);

                messages.push({
                    id:crypto.randomUUID(),
                    sender:currentUser,
                    type:"audio",
                    audio:reader.result,
                    time:Date.now(),
                    reaction:null
                });

                saveChat(currentUser,currentChat,messages);
                renderMessages();
                renderChats();

                stream.getTracks().forEach(t=>t.stop());
            };

            reader.readAsDataURL(blob);
        };

        recorder.start();

        recording=true;

        document.getElementById("recordBtn").classList.add("recording");
        document.getElementById("recordBtn").textContent="⏹️";

    }catch(e){
        alert("دسترسی به میکروفون امکان‌پذیر نیست.");
    }
}

/* =========================
   PROFILE
========================= */

function showPage(page){

    document.getElementById("empty").style.display="none";
    document.getElementById("chat").style.display="none";

    document.getElementById("profilePage").style.display="none";
    document.getElementById("contactsPage").style.display="none";
    document.getElementById("settingsPage").style.display="none";

    if(page==="profile"){
        const me=getMe();

        document.getElementById("usernameInput").value=me.name;
        document.getElementById("statusInput").value=
            me.status||"سلام! من در Nebula هستم 🌌";

        document.getElementById("profilePage").style.display="block";
    }

    if(page==="contacts"){
        renderFullContacts();
        document.getElementById("contactsPage").style.display="block";
    }

    if(page==="settings"){
        document.getElementById("settingsPage").style.display="block";
    }
}

function renderFullContacts(){

    const box=document.getElementById("contacts");

    box.innerHTML="";

    users
    .filter(u=>u.name!==currentUser)
    .forEach(user=>{
        const el=document.createElement("div");
        el.className="contact";

        el.innerHTML=`
            <div class="avatar">${user.avatar}</div>
            <div class="contact-info">
                <strong>${escapeHTML(user.name)}</strong>
                <div style="font-size:11px;color:#777">
                    ${escapeHTML(user.status||"بدون وضعیت")}
                </div>
            </div>
            <button class="primary" onclick="openChat('${escapeAttribute(user.name)}')">
                چت
            </button>
        `;

        box.appendChild(el);
    });
}

function selectAvatar(a){
    selectedAvatar=a;
    document.getElementById("profileAvatar").textContent=a;
}

function saveProfile(){

    const me=getMe();

    const oldName=me.name;
    const newName=document.getElementById("usernameInput").value.trim();
    const status=document.getElementById("statusInput").value.trim();

    if(!newName){
        alert("نام کاربری نمی‌تواند خالی باشد.");
        return;
    }

    if(newName!==oldName &&
       users.some(u=>u.name.toLowerCase()===newName.toLowerCase())){
        alert("این نام کاربری قبلاً استفاده شده است.");
        return;
    }

    /* MIGRATE CHATS */
    if(newName!==oldName){

        users
        .filter(u=>u.name!==oldName)
        .forEach(other=>{

            const oldKey=chatKey(oldName,other.name);
            const newKey=chatKey(newName,other.name);

            const messages=JSON.parse(
                localStorage.getItem(oldKey)||"[]"
            );

            if(messages.length){

                messages.forEach(m=>{
                    if(m.sender===oldName){
                        m.sender=newName;
                    }
                });

                localStorage.setItem(
                    newKey,
                    JSON.stringify(messages)
                );

                localStorage.removeItem(oldKey);
            }

            const oldRead=localStorage.getItem(
                readKey(oldName,other.name)
            );

            if(oldRead){
                localStorage.setItem(
                    readKey(newName,other.name),
                    oldRead
                );

                localStorage.removeItem(
                    readKey(oldName,other.name)
                );
            }
        });

        me.name=newName;
        currentUser=newName;

        localStorage.setItem(
            CURRENT_KEY,
            newName
        );
    }

    me.avatar=selectedAvatar;
    me.status=status||"در Nebula هستم 🌌";
    me.online=true;

    saveUsers();

    updateMeUI();
    renderCurrentList();

    alert("پروفایل با موفقیت ذخیره شد 🌌");
}

   RESET
========================= */

function resetApp(){

    if(!confirm("همه اطلاعات Nebula پاک شود؟"))return;

    localStorage.clear();
    location.reload();
}

/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(str){
    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttribute(str){
    return String(str)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}

   START
========================= */

updateMeUI();
renderChats();
