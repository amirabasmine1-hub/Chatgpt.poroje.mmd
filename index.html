<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Messenger 0.8</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#070a13;
    color:white;
}

button,input{
    font-family:inherit;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#101525;
    position:relative;
    overflow:hidden;
}

/* AUTH */

.auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.auth-box{
    width:100%;
    padding:28px;
    border-radius:25px;
    background:#151b2d;
    border:1px solid #27304a;
    box-shadow:0 20px 60px #0008;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:78px;
    height:78px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:23px;
    font-size:39px;
    background:linear-gradient(135deg,#6c5ce7,#00cec9);
}

.logo h1{
    margin-top:12px;
    font-size:26px;
}

.logo p{
    color:#7e89a4;
    font-size:12px;
    margin-top:6px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.tab{
    flex:1;
    padding:12px;
    border:0;
    border-radius:13px;
    background:#202840;
    color:#aab3c9;
    cursor:pointer;
}

.tab.active{
    background:#6c5ce7;
    color:white;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#aab3c9;
    font-size:13px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px;
    border:1px solid #2b3551;
    border-radius:13px;
    background:#0c111e;
    color:white;
    outline:none;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:#6c5ce7;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.error{
    min-height:18px;
    color:#ff7675;
    font-size:12px;
    margin:8px 0;
}

/* HOME */

.home{
    display:none;
    min-height:100vh;
}

.header{
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #202840;
}

.header h2{
    font-size:21px;
}

.header small{
    color:#707b96;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:13px;
    background:#202840;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.profile{
    margin:15px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-radius:19px;
    background:linear-gradient(135deg,#1d2542,#151b2d);
}

.profile-avatar{
    width:53px;
    height:53px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:#292f49;
    font-size:27px;
}

.profile-info{
    flex:1;
}

.profile-info b{
    display:block;
}

.profile-info span{
    font-size:11px;
}

.status-online{
    color:#00cec9;
}

.status-offline{
    color:#747f98;
}

.search{
    padding:0 15px 13px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #252e47;
    border-radius:14px;
    background:#0c111e;
    color:white;
    outline:none;
}

.nav{
    display:flex;
    margin:0 12px 10px;
    padding:4px;
    border-radius:14px;
    background:#181f32;
}

.nav button{
    flex:1;
    border:0;
    padding:11px;
    border-radius:11px;
    background:none;
    color:#78839d;
    cursor:pointer;
}

.nav button.active{
    background:#292f49;
    color:white;
}

.section-title{
    padding:7px 18px;
    color:#78839d;
    font-size:12px;
}

.chat-list,
.contacts{
    padding:0 9px 20px;
}

.chat-item,
.contact-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px 9px;
    border-radius:16px;
    cursor:pointer;
}

.chat-item:hover,
.contact-item:hover{
    background:#1b2235;
}

.avatar{
    width:50px;
    height:50px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:#252d47;
    font-size:25px;
    position:relative;
}

.online-dot{
    position:absolute;
    width:10px;
    height:10px;
    left:0;
    bottom:1px;
    border-radius:50%;
    background:#00cec9;
    border:2px solid #101525;
}

.offline-dot{
    position:absolute;
    width:10px;
    height:10px;
    left:0;
    bottom:1px;
    border-radius:50%;
    background:#69748d;
    border:2px solid #101525;
}

.info{
    flex:1;
    min-width:0;
}

.info b{
    display:block;
}

.info span{
    display:block;
    margin-top:4px;
    color:#737e98;
    font-size:11px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.empty{
    text-align:center;
    color:#69748e;
    padding:40px 20px;
}

/* CHAT */

.chat{
    display:none;
    height:100vh;
    flex-direction:column;
}

.chat-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid #202840;
}

.back{
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.chat-title{
    flex:1;
}

.chat-title b{
    display:block;
}

.chat-title span{
    font-size:10px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 13px;
}

.msg{
    max-width:78%;
    padding:9px 13px;
    margin-bottom:10px;
    border-radius:17px;
    font-size:14px;
    line-height:1.6;
}

.msg.me{
    margin-right:auto;
    background:#6355d9;
    border-bottom-right-radius:5px;
}

.msg.other{
    margin-left:auto;
    background:#202840;
    border-bottom-left-radius:5px;
}

.msg-time{
    display:block;
    font-size:9px;
    opacity:.6;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid #202840;
}

.chat-input input{
    flex:1;
    padding:13px;
    border:0;
    border-radius:14px;
    background:#202840;
    color:white;
    outline:none;
}

.send{
    width:48px;
    border:0;
    border-radius:14px;
    background:#6c5ce7;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* PROFILE PAGE */

.profile-page{
    display:none;
    position:absolute;
    inset:0;
    z-index:30;
    background:#101525;
}

.page-header{
    display:flex;
    align-items:center;
    gap:15px;
    padding:18px;
    border-bottom:1px solid #202840;
}

.page-header button{
    border:0;
    background:none;
    color:white;
    font-size:27px;
    cursor:pointer;
}

.profile-big{
    width:105px;
    height:105px;
    margin:28px auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:30px;
    background:#252d47;
    font-size:52px;
}

.profile-page-name{
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.profile-page-status{
    text-align:center;
    color:#00cec9;
    font-size:11px;
    margin-top:5px;
}

.card{
    margin:18px;
    padding:16px;
    border-radius:17px;
    background:#181f32;
}

.card label{
    display:block;
    color:#77829c;
    font-size:11px;
    margin-bottom:8px;
}

.card input{
    width:100%;
    padding:12px;
    border:1px solid #2a3450;
    border-radius:12px;
    background:#0c111e;
    color:white;
    outline:none;
}

.avatar-picker{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.avatar-choice{
    width:45px;
    height:45px;
    border:2px solid transparent;
    border-radius:13px;
    background:#202840;
    font-size:22px;
    cursor:pointer;
}

.avatar-choice.selected{
    border-color:#6c5ce7;
}

.save-btn{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:0;
    border-radius:13px;
    background:#6c5ce7;
    color:white;
    font-weight:bold;
}

.logout{
    width:calc(100% - 36px);
    margin:0 18px;
    padding:13px;
    border:0;
    border-radius:13px;
    background:#392129;
    color:#ff7675;
}

/* SETTINGS */

.settings{
    display:none;
    position:absolute;
    inset:0;
    z-index:20;
    background:#101525;
}

.settings-body{
    padding:20px;
}

.setting-card{
    padding:16px;
    margin-bottom:12px;
    border-radius:16px;
    background:#181f32;
}

.setting-card span{
    color:#727d97;
    font-size:11px;
}

</style>
</head>

<body>

<div class="app">

<!-- AUTH -->

<div class="auth" id="auth">

<div class="auth-box">

<div class="logo">
<div class="logo-icon">☄️</div>
<h1>Nebula Messenger</h1>
<p>نسخه 0.8 • Profile Edition</p>
</div>

<div class="tabs">
<button class="tab active" id="loginTab"
onclick="switchAuth('login')">ورود</button>

<button class="tab" id="registerTab"
onclick="switchAuth('register')">ثبت‌نام</button>
</div>

<div id="loginForm">

<div class="field">
<label>نام کاربری</label>
<input id="loginUsername" placeholder="نام کاربری">
</div>

<div class="field">
<label>رمز عبور</label>
<input id="loginPassword" type="password" placeholder="رمز عبور">
</div>

<div class="error" id="loginError"></div>

<button class="main-btn" onclick="login()">ورود 🚀</button>

</div>

<div id="registerForm" style="display:none">

<div class="field">
<label>نام کاربری</label>
<input id="registerUsername" placeholder="حداقل ۳ کاراکتر">
</div>

<div class="field">
<label>رمز عبور</label>
<input id="registerPassword" type="password">
</div>

<div class="field">
<label>تکرار رمز عبور</label>
<input id="registerConfirm" type="password">
</div>

<div class="error" id="registerError"></div>

<button class="main-btn" onclick="register()">ساخت حساب ✨</button>

</div>

</div>
</div>


<!-- HOME -->

<div class="home" id="home">

<div class="header">

<div>
<h2>💬 Nebula</h2>
<small>نسخه 0.8</small>
</div>

<div class="header-buttons">

<button class="icon-btn"
onclick="openProfile()">👤</button>

<button class="icon-btn"
onclick="openSettings()">⚙️</button>

</div>

</div>


<div class="profile">

<div class="profile-avatar" id="myAvatar">👨‍💻</div>

<div class="profile-info">
<b id="myName">---</b>
<span class="status-online">● آنلاین</span>
</div>

</div>


<div class="search">
<input id="searchInput"
placeholder="🔎 جستجو..."
oninput="renderCurrentPage()">
</div>


<div class="nav">

<button id="chatsTab"
class="active"
onclick="showPage('chats')">
💬 چت‌ها
</button>

<button id="contactsTab"
onclick="showPage('contacts')">
👥 مخاطبین
</button>

</div>


<div id="chatsPage">

<div class="section-title">
چت‌های اخیر
</div>

<div class="chat-list" id="chatList"></div>

</div>


<div id="contactsPage" style="display:none">

<div class="section-title">
همه کاربران
</div>

<div class="contacts" id="contacts"></div>

</div>

</div>


<!-- CHAT -->

<div class="chat" id="chat">

<div class="chat-header">

<button class="back"
onclick="closeChat()">‹</button>

<div class="avatar" id="chatAvatar">
🤖
</div>

<div class="chat-title">

<b id="chatName">---</b>

<span id="chatStatus"
class="status-online">
● آنلاین
</span>

</div>

<button class="icon-btn"
onclick="clearChat()">🗑️</button>

</div>


<div class="messages" id="messages"></div>


<div class="chat-input">

<input id="messageInput"
placeholder="پیام بنویس..."
onkeydown="if(event.key==='Enter')sendMessage()">

<button class="send"
onclick="sendMessage()">➤</button>

</div>

</div>


<!-- PROFILE -->

<div class="profile-page" id="profilePage">

<div class="page-header">

<button onclick="closeProfile()">‹</button>

<h2>پروفایل من</h2>

</div>


<div class="profile-big"
id="profileBigAvatar">
👨‍💻
</div>

<div class="profile-page-name"
id="profilePageName">
---
</div>

<div class="profile-page-status">
● آنلاین
</div>


<div class="card">

<label>نام کاربری</label>

<input id="editName"
maxlength="25">

<label style="margin-top:15px">
آواتار
</label>

<div class="avatar-picker">

<button class="avatar-choice selected"
onclick="chooseAvatar(this,'👨‍💻')">👨‍💻</button>

<button class="avatar-choice"
onclick="chooseAvatar(this,'😎')">😎</button>

<button class="avatar-choice"
onclick="chooseAvatar(this,'🚀')">🚀</button>

<button class="avatar-choice"
onclick="chooseAvatar(this,'👾')">👾</button>

<button class="avatar-choice"
onclick="chooseAvatar(this,'🤖')">🤖</button>

<button class="avatar-choice"
onclick="chooseAvatar(this,'🧑‍🚀')">🧑‍🚀</button>

</div>

<button class="save-btn"
onclick="saveProfile()">
💾 ذخیره تغییرات
</button>

<div class="error" id="profileError"></div>

</div>


<button class="logout"
onclick="logout()">
🚪 خروج از حساب
</button>

</div>


<!-- SETTINGS -->

<div class="settings" id="settings">

<div class="page-header">

<button onclick="closeSettings()">‹</button>

<h2>تنظیمات</h2>

</div>

<div class="settings-body">

<div class="setting-card">
<b>Nebula Messenger</b>
<br>
<span>نسخه 0.8 • Profile Edition</span>
</div>

<div class="setting-card">
<b>🔒 حالت محلی</b>
<br>
<span>
اطلاعات این نسخه داخل مرورگر ذخیره می‌شود.
</span>
</div>

</div>

</div>

</div>


<script>

let currentUser =
localStorage.getItem("nebulaCurrentUser");

let currentChat = null;

let currentPage = "chats";

let selectedProfileAvatar = "👨‍💻";


/* USERS */

function getUsers(){

return JSON.parse(
localStorage.getItem("nebulaUsers") || "[]"
);

}

function saveUsers(users){

localStorage.setItem(
"nebulaUsers",
JSON.stringify(users)
);

}


/* PASSWORD */

async function hashPassword(password){

const data =
new TextEncoder().encode(password);

const hash =
await crypto.subtle.digest(
"SHA-256",
data
);

return [...new Uint8Array(hash)]
.map(x=>x.toString(16).padStart(2,"0"))
.join("");

}


/* AUTH */

function switchAuth(type){

const login =
type === "login";

document.getElementById("loginForm")
.style.display =
login ? "block" : "none";

document.getElementById("registerForm")
.style.display =
login ? "none" : "block";

document.getElementById("loginTab")
.classList.toggle("active",login);

document.getElementById("registerTab")
.classList.toggle("active",!login);

}


/* REGISTER */

async function register(){

const username =
document.getElementById("registerUsername")
.value.trim();

const password =
document.getElementById("registerPassword")
.value;

const confirm =
document.getElementById("registerConfirm")
.value;

const error =
document.getElementById("registerError");

error.textContent = "";

if(username.length < 3){

error.textContent =
"نام کاربری باید حداقل ۳ کاراکتر باشد.";

return;

}

if(password.length < 4){

error.textContent =
"رمز عبور حداقل ۴ کاراکتر باشد.";

return;

}

if(password !== confirm){

error.textContent =
"رمزها یکسان نیستند.";

return;

}

const users = getUsers();

if(users.some(
u=>u.name.toLowerCase() === username.toLowerCase()
)){

error.textContent =
"این نام کاربری قبلاً استفاده شده.";

return;

}

const hash =
await hashPassword(password);

users.push({

name:username,

avatar:"👨‍💻",

passwordHash:hash,

online:true,

createdAt:Date.now()

});

saveUsers(users);

currentUser = username;

localStorage.setItem(
"nebulaCurrentUser",
username
);

showHome();

}


/* LOGIN */

async function login(){

const username =
document.getElementById("loginUsername")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

const error =
document.getElementById("loginError");

const user =
getUsers().find(
u=>u.name.toLowerCase()
=== username.toLowerCase()
);

if(!user){

error.textContent =
"نام کاربری یا رمز عبور اشتباه است.";

return;

}

const hash =
await hashPassword(password);

if(hash !== user.passwordHash){

error.textContent =
"نام کاربری یا رمز عبور اشتباه است.";

return;

}

user.online = true;

saveUsers(getUsers());

currentUser = user.name;

localStorage.setItem(
"nebulaCurrentUser",
currentUser
);

showHome();

}


/* HOME */

function showHome(){

document.getElementById("auth")
.style.display = "none";

document.getElementById("home")
.style.display = "block";

document.getElementById("chat")
.style.display = "none";

const user =
getUsers().find(
u=>u.name===currentUser
);

if(!user){

logout();

return;

}

document.getElementById("myName")
.textContent = user.name;

document.getElementById("myAvatar")
.textContent = user.avatar;

showPage("chats");

}


/* PAGES */

function showPage(page){

currentPage = page;

document.getElementById("chatsPage")
.style.display =
page==="chats" ? "block" : "none";

document.getElementById("contactsPage")
.style.display =
page==="contacts" ? "block" : "none";

document.getElementById("chatsTab")
.classList.toggle(
"active",
page==="chats"
);

document.getElementById("contactsTab")
.classList.toggle(
"active",
page==="contacts"
);

renderCurrentPage();

}


function renderCurrentPage(){

if(currentPage==="chats")
renderChats();

else
renderContacts();

}


/* CHAT KEY */

function chatKey(a,b){

return "nebula_chat_" +
[a,b].sort().join("_");

}


/* CHAT */

function getChat(username){

return JSON.parse(
localStorage.getItem(
chatKey(currentUser,username)
) || "[]"
);

}


/* CHATS */

function renderChats(){

const list =
document.getElementById("chatList");

const search =
document.getElementById("searchInput")
.value.trim().toLowerCase();

const users =
getUsers()
.filter(u=>u.name!==currentUser)
.filter(u=>
u.name.toLowerCase()
.includes(search)
);

let chats =
users.map(user=>{

const messages =
getChat(user.name);

const last =
messages[messages.length-1];

return {
user:user,
last:last
};

});

chats.sort((a,b)=>
(b.last?.timestamp||0) -
(a.last?.timestamp||0)
);

list.innerHTML = "";

if(chats.length===0){

list.innerHTML =
`<div class="empty">
هنوز چتی وجود ندارد 💬
</div>`;

return;

}

chats.forEach(c=>{

const div =
document.createElement("div");

div.className = "chat-item";

const status =
c.user.online !== false;

div.innerHTML = `

<div class="avatar">

${escapeHTML(c.user.avatar)}

<span class="${
status
? "online-dot"
: "offline-dot"
}"></span>

</div>

<div class="info">

<b>${escapeHTML(c.user.name)}</b>

<span>
${
c.last
? escapeHTML(c.last.text)
: "شروع گفت‌وگو..."
}
</span>

</div>

`;

div.onclick =
()=>openChat(c.user.name);

list.appendChild(div);

});

}


/* CONTACTS */

function renderContacts(){

const list =
document.getElementById("contacts");

const search =
document.getElementById("searchInput")
.value.trim().toLowerCase();

const users =
getUsers()
.filter(u=>u.name!==currentUser)
.filter(u=>
u.name.toLowerCase()
.includes(search)
);

list.innerHTML = "";

if(users.length===0){

list.innerHTML =
`<div class="empty">
مخاطبی پیدا نشد 👥
</div>`;

return;

}

users.forEach(user=>{

const div =
document.createElement("div");

div.className =
"contact-item";

const online =
user.online !== false;

div.innerHTML = `

<div class="avatar">

${escapeHTML(user.avatar)}

<span class="${
online
? "online-dot"
: "offline-dot"
}"></span>

</div>

<div class="info">

<b>${escapeHTML(user.name)}</b>

/* OPEN CHAT */

function openChat(username){

const user =
getUsers().find(
u=>u.name===username
);

if(!user) return;

currentChat = username;

document.getElementById("home")
.style.display = "none";

document.getElementById("chat")
.style.display = "flex";

document.getElementById("chatName")
.textContent = user.name;

document.getElementById("chatAvatar")
.firstChild.textContent =
user.avatar;

document.getElementById("chatStatus")
.textContent =
user.online !== false
? "● آنلاین"
: "○ آفلاین";

document.getElementById("chatStatus")
.className =
user.online !== false
? "status-online"
: "status-offline";

loadMessages();

}


/* CLOSE CHAT */

function closeChat(){

currentChat = null;

document.getElementById("chat")
.style.display = "none";

document.getElementById("home")
.style.display = "block";

renderCurrentPage();

}


/* LOAD */

function loadMessages(){

const box =
document.getElementById("messages");

const messages =
getChat(currentChat);

box.innerHTML = "";

messages.forEach(msg=>{

const div =
document.createElement("div");

div.className =
"msg " +
(msg.sender===currentUser
? "me"
: "other");

div.innerHTML =
`${escapeHTML(msg.text)}
<span class="msg-time">
${msg.time}
</span>`;

box.appendChild(div);

});

box.scrollTop =
box.scrollHeight;

}


/* SEND */

function sendMessage(){

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(!text || !currentChat)
return;

const key =
chatKey(currentUser,currentChat);

const messages =
JSON.parse(
localStorage.getItem(key)||"[]"
);

const now =
new Date();

messages.push({

sender:currentUser,

text:text,

time:now.toLocaleTimeString(
"fa-IR",
{
hour:"2-digit",
minute:"2-digit"
}
),

timestamp:Date.now()

});

localStorage.setItem(
key,
JSON.stringify(messages)
);

input.value = "";

loadMessages();

}


/* CLEAR */

function clearChat(){

if(!currentChat)
return;

localStorage.removeItem(
chatKey(currentUser,currentChat)
);

loadMessages();

}


/* PROFILE */

function openProfile(){

const user =
getUsers().find(
u=>u.name===currentUser
);

if(!user) return;

selectedProfileAvatar =
user.avatar;

document.getElementById("profilePage")
.style.display = "block";

document.getElementById("profileBigAvatar")
.textContent = user.avatar;

document.getElementById("profilePageName")
.textContent = user.name;

document.getElementById("editName")
.value = user.name;

}


function closeProfile(){

document.getElementById("profilePage")
.style.display = "none";

}


function chooseAvatar(button,avatar){

selectedProfileAvatar = avatar;

document.querySelectorAll(".avatar-choice")
.forEach(x=>
x.classList.remove("selected")
);

button.classList.add("selected");

document.getElementById("profileBigAvatar")
.textContent = avatar;

}


function saveProfile(){

const newName =
document.getElementById("editName")
.value.trim();

const error =
document.getElementById("profileError");

error.textContent = "";

if(newName.length < 3){

error.textContent =
"نام کاربری حداقل ۳ کاراکتر باشد.";

return;

}

const users = getUsers();

const exists =
users.some(
u =>
u.name.toLowerCase() ===
newName.toLowerCase()
&&
u.name !== currentUser
);

if(exists){

error.textContent =
"این نام قبلاً استفاده شده.";

return;

}

const user =
users.find(
u=>u.name===currentUser
);

if(!user) return;

user.name = newName;

user.avatar =
selectedProfileAvatar;

saveUsers(users);

currentUser = newName;

localStorage.setItem(
"nebulaCurrentUser",
newName
);

document.getElementById("myName")
.textContent = newName;

document.getElementById("myAvatar")
.textContent = selectedProfileAvatar;

document.getElementById("profilePageName")
.textContent = newName;

alert("پروفایل با موفقیت ذخیره شد ✅");

closeProfile();

renderCurrentPage();

}

function closeSettings(){

/* LOGOUT */

function logout(){

const users = getUsers();

const user =
users.find(
u=>u.name===currentUser
);

if(user){

user.online = false;

saveUsers(users);

}

localStorage.removeItem(
"nebulaCurrentUser"
);

currentUser = null;

document.getElementById("home")
.style.display = "none";

document.getElementById("chat")
.style.display = "none";

document.getElementById("profilePage")
.style.display = "none";

document.getElementById("settings")
.style.display = "none";

document.getElementById("auth")
.style.display = "flex";

}


/* ESCAPE */

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}
