<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nebula Messenger 0.7</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#070a13;
    color:white;
}

button,input{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#101525;
    overflow:hidden;
    position:relative;
}

/* AUTH */

.auth{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.auth-box{
    width:100%;
    background:#151b2d;
    padding:28px;
    border-radius:25px;
    border:1px solid #27304a;
    box-shadow:0 20px 60px #0008;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:75px;
    height:75px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:38px;
    background:linear-gradient(135deg,#6c5ce7,#00cec9);
}

.logo h1{
    margin-top:12px;
    font-size:26px;
}

.logo p{
    color:#818ba5;
    font-size:12px;
    margin-top:6px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.tab{
    flex:1;
    padding:12px;
    border:0;
    border-radius:13px;
    background:#202840;
    color:#aab3c9;
}

.tab.active{
    background:#6c5ce7;
    color:white;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#aab3c9;
    font-size:13px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px;
    border:1px solid #2b3551;
    border-radius:13px;
    background:#0c111e;
    color:white;
    outline:none;
}

.main-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:14px;
    background:#6c5ce7;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.error{
    min-height:18px;
    color:#ff7675;
    font-size:12px;
    margin:8px 0;
}

/* HOME */

.home{
    display:none;
    min-height:100vh;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid #202840;
}

.header h2{
    font-size:21px;
}

.header small{
    color:#707b96;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:13px;
    background:#202840;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.profile{
    margin:15px;
    padding:14px;
    border-radius:18px;
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(135deg,#1c2440,#151b2d);
}

.profile-avatar{
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:#282f49;
    font-size:25px;
}

.profile-info{
    flex:1;
}

.profile-info b{
    display:block;
}

.profile-info span{
    color:#707b96;
    font-size:11px;
}

.search{
    padding:0 15px 12px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #252e47;
    border-radius:14px;
    background:#0c111e;
    color:white;
    outline:none;
}

.section-title{
    display:flex;
    justify-content:space-between;
    padding:8px 18px;
    color:#737e98;
    font-size:12px;
}

.chat-list{
    padding:0 9px 20px;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px 9px;
    border-radius:16px;
    cursor:pointer;
}

.chat-item:hover{
    background:#1b2235;
}

.chat-avatar{
    width:50px;
    height:50px;
    flex-shrink:0;
    border-radius:16px;
    background:#252d47;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    position:relative;
}

.pin{
    position:absolute;
    bottom:-3px;
    left:-3px;
    font-size:12px;
}

.chat-info{
    flex:1;
    min-width:0;
}

.chat-top{
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.chat-top b{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.chat-time{
    color:#68738d;
    font-size:10px;
}

.last-message{
    color:#737e98;
    font-size:12px;
    margin-top:5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.unread{
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    background:#6c5ce7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.empty{
    text-align:center;
    color:#68738d;
    padding:40px 20px;
}

/* CHAT */

.chat{
    display:none;
    height:100vh;
    flex-direction:column;
}

.chat-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid #202840;
}

.back{
    border:0;
    background:none;
    color:white;
    font-size:27px;
    cursor:pointer;
}

.chat-avatar-head{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#252d47;
    border-radius:13px;
    font-size:21px;
}

.chat-title{
    flex:1;
}

.chat-title b{
    display:block;
}

.chat-title span{
    color:#00cec9;
    font-size:10px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 13px;
}

.msg{
    max-width:78%;
    padding:9px 13px;
    margin-bottom:10px;
    border-radius:17px;
    font-size:14px;
    line-height:1.6;
}

.msg.me{
    margin-right:auto;
    background:#6355d9;
    border-bottom-right-radius:5px;
}

.msg.other{
    margin-left:auto;
    background:#202840;
    border-bottom-left-radius:5px;
}

.msg-time{
    display:block;
    font-size:9px;
    opacity:.6;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid #202840;
}

.chat-input input{
    flex:1;
    padding:13px;
    border:0;
    border-radius:14px;
    background:#202840;
    color:white;
    outline:none;
}

.send{
    width:48px;
    border:0;
    border-radius:14px;
    background:#6c5ce7;
    color:white;
    font-size:18px;
}

/* SETTINGS */

.settings{
    display:none;
    position:absolute;
    inset:0;
    z-index:20;
    background:#101525;
}

.settings-header{
    display:flex;
    align-items:center;
    gap:15px;
    padding:18px;
    border-bottom:1px solid #202840;
}

.settings-header button{
    border:0;
    background:none;
    color:white;
    font-size:26px;
}

.settings-body{
    padding:20px;
}

.big-avatar{
    width:90px;
    height:90px;
    margin:10px auto 20px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#252d47;
    font-size:45px;
}

.setting-card{
    background:#181f32;
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
}

.setting-card span{
    color:#707b96;
    font-size:11px;
}

.danger{
    width:100%;
    padding:13px;
    border:0;
    border-radius:14px;
    background:#392129;
    color:#ff7675;
}
</style>
</head>

<body>

<div class="app">

<!-- AUTH -->

<div class="auth" id="auth">

<div class="auth-box">

<div class="logo">
<div class="logo-icon">☄️</div>
<h1>Nebula Messenger</h1>
<p>نسخه 0.7 • Chat Edition</p>
</div>

<div class="tabs">
<button class="tab active" id="loginTab" onclick="switchAuth('login')">ورود</button>
<button class="tab" id="registerTab" onclick="switchAuth('register')">ثبت‌نام</button>
</div>

<div id="loginForm">

<div class="field">
<label>نام کاربری</label>
<input id="loginUsername" placeholder="نام کاربری">
</div>

<div class="field">
<label>رمز عبور</label>
<input id="loginPassword" type="password" placeholder="رمز عبور">
</div>

<div class="error" id="loginError"></div>

<button class="main-btn" onclick="login()">ورود 🚀</button>

</div>

<div id="registerForm" style="display:none">

<div class="field">
<label>نام کاربری</label>
<input id="registerUsername" placeholder="حداقل ۳ کاراکتر">
</div>

<div class="field">
<label>رمز عبور</label>
<input id="registerPassword" type="password" placeholder="حداقل ۴ کاراکتر">
</div>

<div class="field">
<label>تکرار رمز عبور</label>
<input id="registerConfirm" type="password">
</div>

<div class="error" id="registerError"></div>

<button class="main-btn" onclick="register()">ساخت حساب ✨</button>

</div>

</div>
</div>


<!-- HOME -->

<div class="home" id="home">

<div class="header">
<div>
<h2>💬 Nebula</h2>
<small>پیام‌رسان من</small>
</div>

<button class="icon-btn" onclick="openSettings()">⚙️</button>
</div>

<div class="profile">

<div class="profile-avatar" id="myAvatar">👨‍💻</div>

<div class="profile-info">
<b id="myName">---</b>
<span>آنلاین</span>
</div>

</div>

<div class="search">
<input id="searchInput"
placeholder="🔎 جستجوی چت..."
oninput="renderChats()">
</div>

<div class="section-title">
<span>چت‌ها</span>
<span id="chatCount">0</span>
</div>

<div class="chat-list" id="chatList"></div>

</div>


<!-- CHAT -->

<div class="chat" id="chat">

<div class="chat-header">

<button class="back" onclick="closeChat()">‹</button>

<div class="chat-avatar-head" id="chatAvatar">🤖</div>

<div class="chat-title">
<b id="chatName">---</b>
<span>● آنلاین</span>
</div>

<button class="icon-btn" onclick="clearChat()">🗑️</button>

</div>

<div class="messages" id="messages"></div>

<div class="chat-input">

<input id="messageInput"
placeholder="پیام بنویس..."
onkeydown="if(event.key==='Enter')sendMessage()">

<button class="send" onclick="sendMessage()">➤</button>

</div>

</div>


<!-- SETTINGS -->

<div class="settings" id="settings">

<div class="settings-header">
<button onclick="closeSettings()">‹</button>
<h2>تنظیمات</h2>
</div>

<div class="settings-body">

<div class="big-avatar" id="settingsAvatar">👨‍💻</div>

<div class="setting-card">
<b id="settingsName">---</b>
<br>
<span>نام کاربری</span>
</div>

<div class="setting-card">
<b>Nebula Messenger</b>
<br>
<span>نسخه 0.7 • Chat Edition</span>
</div>

<button class="danger" onclick="logout()">
🚪 خروج از حساب
</button>

</div>
</div>

</div>


<script>

let currentUser =
localStorage.getItem("nebulaCurrentUser");

let currentChat = null;


/* USERS */

function getUsers(){

    return JSON.parse(
        localStorage.getItem("nebulaUsers") || "[]"
    );

}

function saveUsers(users){

    localStorage.setItem(
        "nebulaUsers",
        JSON.stringify(users)
    );

}


/* HASH */

async function hashPassword(password){

    const data =
        new TextEncoder().encode(password);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return [...new Uint8Array(hash)]
        .map(x=>x.toString(16).padStart(2,"0"))
        .join("");

}


/* AUTH */

function switchAuth(type){

    const login =
        type === "login";

    document.getElementById("loginForm")
        .style.display =
        login ? "block" : "none";

    document.getElementById("registerForm")
        .style.display =
        login ? "none" : "block";

    document.getElementById("loginTab")
        .classList.toggle("active",login);

    document.getElementById("registerTab")
        .classList.toggle("active",!login);

}


/* REGISTER */

async function register(){

    const username =
        document.getElementById("registerUsername")
        .value.trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    const confirm =
        document.getElementById("registerConfirm")
        .value;

    const error =
        document.getElementById("registerError");

    error.textContent = "";

    if(username.length < 3){
        error.textContent =
            "نام کاربری خیلی کوتاه است.";
        return;
    }

    if(password.length < 4){
        error.textContent =
            "رمز عبور حداقل ۴ کاراکتر باشد.";
        return;
    }

    if(password !== confirm){
        error.textContent =
            "رمزها یکسان نیستند.";
        return;
    }

    const users = getUsers();

    if(users.some(
        u => u.name.toLowerCase() === username.toLowerCase()
    )){
        error.textContent =
            "این نام کاربری قبلاً ثبت شده.";
        return;
    }

    const hash =
        await hashPassword(password);

    users.push({
        name:username,
        avatar:"👨‍💻",
        passwordHash:hash,
        createdAt:Date.now()
    });

    saveUsers(users);

    currentUser = username;

    localStorage.setItem(
        "nebulaCurrentUser",
        username
    );

    showHome();

}


/* LOGIN */

async function login(){

    const username =
        document.getElementById("loginUsername")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const error =
        document.getElementById("loginError");

    const user =
        getUsers().find(
            u =>
            u.name.toLowerCase() ===
            username.toLowerCase()
        );

    if(!user){
        error.textContent =
            "نام کاربری یا رمز عبور اشتباه است.";
        return;
    }

    const hash =
        await hashPassword(password);

    if(hash !== user.passwordHash){
        error.textContent =
            "نام کاربری یا رمز عبور اشتباه است.";
        return;
    }

    currentUser = user.name;

    localStorage.setItem(
        "nebulaCurrentUser",
        currentUser
    );

    showHome();

}


/* HOME */

function showHome(){

    document.getElementById("auth")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";

    document.getElementById("chat")
        .style.display = "none";

    const user =
        getUsers().find(
            u=>u.name === currentUser
        );

    if(!user){
        logout();
        return;
    }

    document.getElementById("myName")
        .textContent = user.name;

    document.getElementById("myAvatar")
        .textContent = user.avatar;

    renderChats();

}


/* CHAT KEY */

function chatKey(a,b){

    return "nebula_chat_" +
        [a,b].sort().join("_");

}


/* CHAT DATA */

function getChat(user){

    return JSON.parse(
        localStorage.getItem(
            chatKey(currentUser,user)
        ) || "[]"
    );

}


/* RENDER CHATS */

function renderChats(){

    const list =
        document.getElementById("chatList");

    const search =
        document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const users =
        getUsers().filter(
            u => u.name !== currentUser
        );

    let chats = users.map(user=>{

        const messages =
            getChat(user.name);

        const last =
            messages[messages.length-1];

        return {
            user:user,
            last:last,
            count:messages.length
        };

    });

    chats = chats.filter(c=>
        c.user.name.toLowerCase()
        .includes(search)
    );

    chats.sort((a,b)=>{

        if(a.user.pinned && !b.user.pinned)
            return -1;

        if(!a.user.pinned && b.user.pinned)
            return 1;

        return (b.last?.timestamp || 0) -
               (a.last?.timestamp || 0);

    });

    document.getElementById("chatCount")
        .textContent = chats.length;

    list.innerHTML = "";

    if(chats.length === 0){

        list.innerHTML =
            `<div class="empty">
                هنوز چتی وجود ندارد 💬
                <br>
                از نسخه بعدی می‌توانیم مخاطب اضافه کنیم!
            </div>`;

        return;
    }

    chats.forEach(c=>{

        const div =
            document.createElement("div");

        div.className = "chat-item";

        let lastText =
            c.last
            ? c.last.text
            : "شروع گفت‌وگو...";

        let time =
            c.last
            ? c.last.time
            : "";

        div.innerHTML = `

        <div class="chat-avatar">
            ${escapeHTML(c.user.avatar)}
            ${c.user.pinned ? '<span class="pin">📌</span>' : ''}
        </div>

        <div class="chat-info">

            <div class="chat-top">
                <b>${escapeHTML(c.user.name)}</b>
                <span class="chat-time">${time}</span>
            </div>

            <div class="last-message">
                ${escapeHTML(lastText)}
            </div>

        </div>

        `;

        div.onclick =
            ()=>openChat(c.user.name);

        div.oncontextmenu =
            e=>{
                e.preventDefault();
                togglePin(c.user.name);
            };

        list.appendChild(div);

    });

}


/* PIN */

function togglePin(username){

    const users = getUsers();

    const user =
        users.find(u=>u.name===username);

    if(!user) return;

    user.pinned =
        !user.pinned;

    saveUsers(users);

    renderChats();

}


/* OPEN CHAT */

function openChat(username){

    const user =
        getUsers().find(
            u=>u.name===username
        );

    if(!user) return;

    currentChat = username;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("chat")
        .style.display = "flex";

    document.getElementById("chatName")
        .textContent = user.name;

    document.getElementById("chatAvatar")
        .textContent = user.avatar;

    loadMessages();

}


/* CLOSE CHAT */

function closeChat(){

    currentChat = null;

    document.getElementById("chat")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";

    renderChats();

}


/* LOAD */

function loadMessages(){

    const box =
        document.getElementById("messages");

    const messages =
        getChat(currentChat);

    box.innerHTML = "";

    messages.forEach(msg=>{

        const div =
            document.createElement("div");

        div.className =
            "msg " +
            (msg.sender === currentUser
                ? "me"
                : "other");

        div.innerHTML =
            `${escapeHTML(msg.text)}
             <span class="msg-time">
                ${msg.time}
             </span>`;

        box.appendChild(div);

    });

    box.scrollTop =
        box.scrollHeight;

}


/* SEND */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text || !currentChat)
        return;

    const key =
        chatKey(currentUser,currentChat);

    const messages =
        JSON.parse(
            localStorage.getItem(key) || "[]"
        );

    const now =
        new Date();

    messages.push({

        sender:currentUser,

        text:text,

        time:now.toLocaleTimeString(
            "fa-IR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ),

        timestamp:Date.now()

    });

    localStorage.setItem(
        key,
        JSON.stringify(messages)
    );

    input.value = "";

    loadMessages();

}


/* CLEAR */

function clearChat(){

    if(!currentChat)
        return;

    localStorage.removeItem(
        chatKey(currentUser,currentChat)
    );

    loadMessages();

}


/* SETTINGS */

function openSettings(){

    const user =
        getUsers().find(
            u=>u.name===currentUser
        );

    if(!user) return;

    document.getElementById("settings")
        .style.display = "block";

    document.getElementById("settingsName")
        .textContent = user.name;

    document.getElementById("settingsAvatar")
        .textContent = user.avatar;

}


function closeSettings(){

    document.getElementById("settings")
        .style.display = "none";

}


/* LOGOUT */

function logout(){

    localStorage.removeItem(
        "nebulaCurrentUser"
    );

    currentUser = null;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("chat")
        .style.display = "none";

    document.getElementById("settings")
        .style.display = "none";

    document.getElementById("auth")
        .style.display = "flex";

}


/* ESCAPE */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* DEMO USERS */

function createDemoUsers(){

    const users = getUsers();

    if(users.length === 0){

        users.push({
            name:"Nebula Bot",
            avatar:"🤖",
            passwordHash:"",
            pinned:true,
            createdAt:Date.now()
        });

        users.push({
            name:"Test User",
            avatar:"👾",
            passwordHash:"",
            pinned:false,
            createdAt:Date.now()
        });

        saveUsers(users);

    }

}


/* START */

createDemoUsers();

if(currentUser){

    showHome();

}else{

    document.getElementById("auth")
        .style.display = "flex";

}

</script>

</body>
</html>
